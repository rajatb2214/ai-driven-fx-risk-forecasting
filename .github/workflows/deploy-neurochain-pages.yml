name: Deploy NeuroChain Website

on:
  push:
    branches:
      - main
    paths:
      - "crypto-ai-platform/public/**"
      - ".github/workflows/deploy-neurochain-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neurochain-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: crypto-ai-platform/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
